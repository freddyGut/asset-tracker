{% extends "base.html" %}

{% block title %}Log in · Asset Tracker{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    {# Forwards the ?next= value set by LoginRequiredMixin, so the user lands on the page they originally requested #}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Log in</button>
  </form>
</div>
{% endblock %}
