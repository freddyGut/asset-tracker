services:
  # PostgreSQL database
  db:
    image: postgres:16

    # Development-only credentials; production uses Railway's managed database
    environment:
      - POSTGRES_DB=assettracker
      - POSTGRES_USER=assettracker
      - POSTGRES_PASSWORD=assettracker

    # Named volume: data survives container restarts and removal
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Lets "web" wait until Postgres accepts connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assettracker -d assettracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Django application
  web:
    build: .

    # Development override of the Dockerfile CMD (gunicorn): runserver reloads on code changes
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

    # Mounts the source code so edits in VS Code are visible inside the container immediately
    volumes:
      - .:/app

    ports:
      - "8000:8000"

    # Variables from .env (not tracked by Git)
    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: