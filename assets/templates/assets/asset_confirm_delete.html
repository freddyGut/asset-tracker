{% extends "base.html" %}

{% block title %}Delete {{ object.tag }} · Asset Tracker{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Delete asset</h1>
  <p>Are you sure you want to delete <strong>{{ object }}</strong>?
     Its history will be deleted too. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{{ object.get_absolute_url }}">Cancel</a>
  </form>
</div>
{% endblock %}c
